<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalMal interaction regression checks</title>
  <link rel="stylesheet" href="/src/styles/index.css">
  <link rel="stylesheet" href="/src/styles/screens.css">
  <link rel="stylesheet" href="/src/styles/intro.css">
  <link rel="stylesheet" href="/src/styles/interactions.css">
  <style>
    .test-controls { padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; }
    #results { white-space: pre-wrap; padding: 20px; }
    body.static-preview .kickoff * { animation: none !important; }
    body.static-preview .kickoff-scan { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div class="test-controls">
      <button class="btn" id="run">Run interaction checks</button>
      <button class="btn" id="preview">Preview final composition</button>
      <button class="btn" id="animate">Replay animation</button>
      <button class="btn" id="sheet">Open keyboard test sheet</button>
      <button class="btn" id="seed">Open synthetic test profile</button>
    </div>
    <pre id="results" role="status">Ready</pre>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="overlay-root"></div><div id="toast-root"></div>
  <script type="module" src="./browser.js"></script>
</body>
</html>
